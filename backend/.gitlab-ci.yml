workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

default:
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository/
    policy: pull-push

server:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - ./mvnw test

server:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

server:deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: server:build
      artifacts: true
  variables:
    DEPLOY_CONTAINER_NAME: app-server
    DEPLOY_DOCKER_ARGS: "-p 8080:8080 --restart unless-stopped --add-host=host.docker.internal:host-gateway"
  before_script:
    - apk add --no-cache openssh-client
    - chmod 400 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -i "$SSH_PRIVATE_KEY" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
      "set -e;
      mkdir -p \"$DEPLOY_PATH\""
    - >
      scp -i "$SSH_PRIVATE_KEY" -P "$DEPLOY_PORT"
      target/*.jar
      "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app.jar"
    - >
      ssh -i "$SSH_PRIVATE_KEY" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
      "set -e;
      cd \"$DEPLOY_PATH\";
      docker pull eclipse-temurin:21-jre;
      docker stop $DEPLOY_CONTAINER_NAME || true;
      docker rm $DEPLOY_CONTAINER_NAME || true;
      docker run -d --name $DEPLOY_CONTAINER_NAME
      $DEPLOY_DOCKER_ARGS
      -v \"$DEPLOY_PATH/app.jar:/app/app.jar:ro\"
      -e SERVER_PORT=8080
      -e SPRING_DATASOURCE_URL=\"${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}\"
      -e SPRING_DATASOURCE_USERNAME=\"${SPRING_DATASOURCE_USERNAME:-postgres}\"
      -e SPRING_DATASOURCE_PASSWORD=\"${SPRING_DATASOURCE_PASSWORD:-REDACTED}\"
      -e ADMIN_FRONTEND_ORIGINS=\"${ADMIN_FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://*.ka.bw-cloud-instance.org}\"
      eclipse-temurin:21-jre
      java -jar /app/app.jar;
      sleep 10;
      docker inspect -f '{{.State.Running}}' $DEPLOY_CONTAINER_NAME | grep true;
      docker logs --tail 100 $DEPLOY_CONTAINER_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

spring.application.name=demo
server.port=${SERVER_PORT:${PORT:8080}}

spring.mail.host=mail.gmx.net
spring.mail.port=587
spring.mail.username=ratemyprof@gmx.de
spring.mail.password=REDACTED

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:REDACTED}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin-patterns=${ADMIN_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.ka.bw-cloud-instance.org}

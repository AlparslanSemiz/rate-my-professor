workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - check
  - test
  - build
  - package

.android-gradle:
  image: ghcr.io/cirruslabs/android-sdk:36
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key: "android-gradle-${CI_COMMIT_REF_SLUG}"
    policy: pull-push
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    - chmod +x ./gradlew

android:check:
  extends: .android-gradle
  stage: check
  script:
    - ./gradlew app:check --no-daemon
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/build/reports/

android:test:
  extends: .android-gradle
  stage: test
  script:
    - ./gradlew app:test --no-daemon
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: app/build/test-results/test*/TEST-*.xml
    paths:
      - app/build/reports/tests/
      - app/build/test-results/

android:build:
  extends: .android-gradle
  stage: build
  script:
    - ./gradlew app:assembleDebug --no-daemon
  artifacts:
    expire_in: 1 week
    paths:
      - app/build/outputs/apk/debug/*.apk

android:package:
  extends: .android-gradle
  stage: package
  script:
    - ./gradlew app:assembleRelease --no-daemon
  artifacts:
    expire_in: 1 month
    paths:
      - app/build/outputs/apk/release/*.apk
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

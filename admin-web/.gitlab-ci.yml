workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - check
  - test
  - build
  - package
  - deploy

variables:
  VITE_API_BASE_URL: "https://server.example.org"

.node-npm:
  image: node:24-alpine
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    policy: pull-push
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

web:check:
  extends: .node-npm
  stage: check
  script:
    - npm run lint
    - npm run typecheck

web:test:
  extends: .node-npm
  stage: test
  script:
    - npm run test

web:build:
  extends: .node-npm
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

web:package:
  extends: .node-npm
  stage: package
  script:
    - npm run build
    - tar -czf admin-web-dist.tar.gz dist/
  artifacts:
    expire_in: 1 month
    paths:
      - admin-web-dist.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

web:deploy:
  image: alpine:3.22
  stage: deploy
  variables:
    DEPLOY_PATH: /var/www/admin-web
  needs:
    - job: web:package
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - mkdir -p deploy
    - tar -xzf admin-web-dist.tar.gz -C deploy
    - ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - rsync -az -e "ssh -p ${DEPLOY_PORT:-22}" deploy/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

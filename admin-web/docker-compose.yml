services:
  db:
    image: postgres:16-alpine
    container_name: admin-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-admin_web}
      POSTGRES_USER: ${LOCAL_DB_USER:-admin_web}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-admin_web}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - admin_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-admin_web} -d ${LOCAL_DB_NAME:-admin_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  admin_web_pgdata:
